<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Circle Line Battle</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#ui{position:fixed;top:18px;left:0;right:0;text-align:center;color:#fff;pointer-events:none}
#title{font-size:25px;font-weight:800;text-shadow:0 2px 12px #000}
#counts{margin-top:8px;font-size:14px;font-weight:800;text-shadow:0 2px 8px #000}
#status{margin-top:5px;font-size:11px;color:#aaa}
#again{
display:none;position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
padding:13px 28px;border:0;border-radius:28px;background:#fff;color:#111;
font-size:16px;font-weight:800;box-shadow:0 0 25px rgba(255,255,255,.25)
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="title">DAY 5 UNTIL RED WINS</div>
  <div id="counts"></div>
  <div id="status">বল লাইন ছুঁলেই: লাইন −১ • আঘাতকারী বলের লাইন +১</div>
</div>
<button id="again">PLAY AGAIN</button>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const title=document.getElementById("title"),counts=document.getElementById("counts");
const again=document.getElementById("again");

const TEAMS=[
 {name:"RED",color:"#ff493f"},
 {name:"CYAN",color:"#26d9d2"},
 {name:"PINK",color:"#ff4e9b"},
 {name:"BLUE",color:"#4386ff"},
 {name:"YELLOW",color:"#ffd52e"}
];

let W,H,DPR,cx,cy,R,balls=[],particles=[];
let gameOver=false,last=0;
const cooldown=new Map();

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2;cy=H*.53;
  R=Math.min(W*.405,H*.36);
}
addEventListener("resize",resize);

function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function makeLines(n){
  const arr=[];
  for(let i=0;i<n;i++){
    // Each line has its own stable offset, so a particular line can disappear.
    arr.push({off:(i+0.5)/n, wob:rand(-.012,.012)});
  }
  return arr;
}

function addLine(ball){
  // New line joins the fan without changing existing lines.
  ball.lines.push({off:Math.random(),wob:rand(-.012,.012)});
}

function makeBall(team,ang){
  const rr=R*rand(.40,.56);
  const b={
    id:Math.random(),
    team,
    color:TEAMS[team].color,
    x:cx+Math.cos(ang)*rr,
    y:cy+Math.sin(ang)*rr,
    vx:0,vy:0,r:15.5,
    lines:makeLines(12),
    phase:rand(0,6.28),
    rot:rand(-.7,.7),
    flash:0,
    trail:[]
  };
  return b;
}

function reset(){
  balls=[];particles=[];cooldown.clear();gameOver=false;
  again.style.display="none";
  title.textContent="DAY 5 UNTIL RED WINS";

  const a=[-2.55,-1.05,.05,1.55,2.65];
  a.forEach((ang,i)=>balls.push(makeBall(i,ang)));

  balls[0].vx=105;balls[0].vy=25;
  balls[1].vx=-95;balls[1].vy=45;
  balls[2].vx=65;balls[2].vy=-85;
  balls[3].vx=-75;balls[3].vy=-65;
  balls[4].vx=20;balls[4].vy=105;

  last=performance.now();
  updateCounts();
}
again.onclick=reset;

function count(team){
  return balls.filter(b=>b.team===team).reduce((s,b)=>s+b.lines.length,0);
}
function updateCounts(){
  counts.innerHTML=TEAMS.map((t,i)=>
    '<span style="color:'+t.color+'">'+t.name+' '+count(i)+'</span>'
  ).join("  ");
}

function burst(x,y,color){
  for(let i=0;i<10;i++){
    const a=rand(0,6.283),s=rand(30,100);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.2,.5),color});
  }
}

// Distance from point P to line segment AB.
// Returns distance and the projection position t (0..1).
function pointSegment(px,py,ax,ay,bx,by){
  const vx=bx-ax,vy=by-ay;
  const len2=vx*vx+vy*vy||1;
  let t=((px-ax)*vx+(py-ay)*vy)/len2;
  t=clamp(t,0,1);
  const x=ax+vx*t,y=ay+vy*t;
  return {d:Math.hypot(px-x,py-y),t,x,y};
}

/*
  IMPORTANT GAME RULE:
  A ball does NOT need to hit another ball.
  It can hit the other ball's LINE.
  When it touches one line:
    target line -> -1 (that exact line disappears)
    hitting ball -> +1 line
*/
function checkLineHits(){
  const now=performance.now();

  for(const attacker of balls){
    for(const target of balls){
      if(attacker===target || target.lines.length===0)continue;

      const centerDistance=Math.hypot(attacker.x-target.x,attacker.y-target.y);
      // If the balls themselves overlap, don't count that as a line hit.
      if(centerDistance < attacker.r+target.r+2)continue;

      const base=Math.atan2(target.y-cy,target.x-cx);
      const fan=Math.PI*.82;

      for(let li=0;li<target.lines.length;li++){
        const L=target.lines[li];

        // Lines fan from the target ball toward the circular wall.
        const ang=base-fan/2+L.off*fan+
                  Math.sin(performance.now()/1000*1.8+target.phase+li*.37)*.012+
                  L.wob;

        const ex=cx+Math.cos(ang)*R;
        const ey=cy+Math.sin(ang)*R;

        const hit=pointSegment(
          attacker.x,attacker.y,
          target.x,target.y,ex,ey
        );

        // Ignore the short part immediately around the target ball.
        if(hit.t < .10)continue;

        // The ball is the "tip" that hits the line.
        if(hit.d <= attacker.r+1.5){
          const key=attacker.id+"|"+target.id+"|"+li;
          const old=cooldown.get(key)||0;
          if(now-old<180)continue;
          cooldown.set(key,now);

          // Remove exactly the line that was touched.
          target.lines.splice(li,1);

          // The ball that touched the line gains exactly one line.
          addLine(attacker);

          attacker.flash=.16;
          target.flash=.22;
          burst(hit.x,hit.y,target.color);

          updateCounts();

          // Stop after one line hit for this attacker in this frame.
          break;
        }
      }
    }
  }
}

function update(dt){
  if(gameOver)return;

  for(const b of balls){
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    b.phase+=b.rot*dt;
    b.flash=Math.max(0,b.flash-dt);

    let speed=Math.hypot(b.vx,b.vy);
    if(speed<65){b.vx*=1.015;b.vy*=1.015}
    if(speed>185){b.vx*=.985;b.vy*=.985}

    const dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy)||1;
    const limit=R-b.r-2;
    if(d>limit){
      const nx=dx/d,ny=dy/d;
      b.x=cx+nx*limit;b.y=cy+ny*limit;
      const dot=b.vx*nx+b.vy*ny;
      b.vx-=2*dot*nx;b.vy-=2*dot*ny;
    }

    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length>7)b.trail.shift();
  }

  // Line collision is the main battle mechanic.
  checkLineHits();

  // Normal physical ball collision only changes movement; it does NOT
  // change line counts, because only touching a line changes counts.
  for(let i=0;i<balls.length;i++){
    for(let j=i+1;j<balls.length;j++){
      const a=balls[i],b=balls[j];
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001;
      const minD=a.r+b.r;
      if(d<minD){
        const nx=dx/d,ny=dy/d;
        const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
        if(rel<0){
          const impulse=-rel*.82;
          a.vx-=impulse*nx;a.vy-=impulse*ny;
          b.vx+=impulse*nx;b.vy+=impulse*ny;
        }
        const push=(minD-d)/2+.1;
        a.x-=nx*push;a.y-=ny*push;
        b.x+=nx*push;b.y+=ny*push;
      }
    }
  }

  // 0 lines = the ball disappears.
  const before=balls.length;
  balls=balls.filter(b=>{
    if(b.lines.length===0){
      burst(b.x,b.y,b.color);
      return false;
    }
    return true;
  });

  for(const p of particles){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt;
  }
  particles=particles.filter(p=>p.life>0);

  updateCounts();

  const alive=[...new Set(balls.map(b=>b.team))];
  if(alive.length<=1){
    gameOver=true;
    if(alive.length)title.textContent=TEAMS[alive[0]].name+" WINS!";
    else title.textContent="DRAW!";
    again.style.display="block";
  }
}

function drawArena(){
  ctx.save();
  ctx.shadowBlur=20;ctx.shadowColor="#fff";
  ctx.strokeStyle="#eee";ctx.lineWidth=3.5;
  ctx.beginPath();ctx.arc(cx,cy,R,0,6.283);ctx.stroke();
  ctx.restore();
}

function drawLines(t){
  for(const b of balls){
    const base=Math.atan2(b.y-cy,b.x-cx);
    const fan=Math.PI*.82;

    for(let i=0;i<b.lines.length;i++){
      const L=b.lines[i];
      const ang=base-fan/2+L.off*fan+
        Math.sin(t*1.8+b.phase+i*.37)*.012+L.wob;

      const ex=cx+Math.cos(ang)*R;
      const ey=cy+Math.sin(ang)*R;

      ctx.save();
      ctx.globalAlpha=.86;
      ctx.strokeStyle=b.color;
      ctx.lineWidth=1.35;
      ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(ex,ey);ctx.stroke();
      ctx.restore();
    }

    for(let k=0;k<b.trail.length;k++){
      const p=b.trail[k];
      ctx.save();ctx.globalAlpha=(k/b.trail.length)*.10;
      ctx.fillStyle=b.color;
      ctx.beginPath();ctx.arc(p.x,p.y,b.r*.55,0,6.283);ctx.fill();
      ctx.restore();
    }
  }
}

function drawBalls(){
  for(const b of balls){
    ctx.save();
    ctx.shadowBlur=b.flash>0?38:22;
    ctx.shadowColor=b.color;
    ctx.fillStyle=b.color;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.fill();
    ctx.restore();

    ctx.fillStyle="rgba(255,255,255,.23)";
    ctx.beginPath();ctx.arc(b.x-4.5,b.y-5,4.8,0,6.283);ctx.fill();

    ctx.strokeStyle="rgba(255,255,255,.65)";
    ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.stroke();
  }
}

function drawParticles(){
  for(const p of particles){
    ctx.save();ctx.globalAlpha=clamp(p.life*2,0,1);
    ctx.fillStyle=p.color;ctx.shadowBlur=8;ctx.shadowColor=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,6.283);ctx.fill();ctx.restore();
  }
}

function draw(t){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  drawArena();
  drawLines(t);
  drawBalls();
  drawParticles();
}

function loop(now){
  const dt=Math.min((now-last)/1000,.032);
  last=now;
  update(dt);
  draw(now/1000);
  requestAnimationFrame(loop);
}

resize();
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
